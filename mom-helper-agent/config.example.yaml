# Copy this file to config.yaml and fill in the real names and numbers.
# Phone numbers in international format: +92 300 1234567.
# Set up for a mother who speaks Punjabi and Urdu and helpers who speak Urdu.

mom:
  name: "Mrs. Batth"                # used when talking to helpers: "This is a call for Mrs. Batth"
  call_her: "امی جی"                 # what the assistant calls her
  phones: ["+923000000000"]         # every number she calls from (mobile, landline). Other callers are refused.

  # Listening: Twilio recognises Urdu (Pakistan). It has no Punjabi recogniser for Pakistan, so her
  # Punjabi arrives as rough Urdu text; the assistant is told to expect that and read it by sound.
  language: "ur-PK"
  speaks: "Punjabi and Urdu, often mixed in one sentence"
  # Speaking: the assistant answers her in simple Urdu, written in Urdu script.
  language_name: "Urdu"
  # voice: ""                       # a Twilio voice for Urdu if your account lists one, see README "Her voice"

  # Anything the assistant should know: health, routines, how she likes to be spoken to.
  notes: |
    Speaks Punjabi at home and Urdu with outsiders. Says little and speaks softly; be patient.
    Was very active all her life and likes to be treated as capable.
    Goes to Dr. Khan's clinic on Tuesdays. Prefers Rashid for rides. Groceries come from Akbar Store.

  # Fixed things she hears, in Urdu. {call_her}, {name}, {names}, {family} are filled in.
  greeting: "السلام علیکم {call_her}۔ بتائیں، میں آپ کی کیا خدمت کروں؟"
  said_yes: "{call_her}، اچھی خبر ہے۔ {name} نے ہاں کر دی ہے، وہ آپ کی مدد کریں گے۔"
  nobody_reached: "{call_her}، {names} سے بات نہیں ہو سکی۔ میں نے {family} کو بتا دیا ہے، وہ جلدی آپ کو فون کریں گے۔"
  asking_family: "{call_her}، میں {name} کو کہہ رہی ہوں کہ آپ کو ابھی فون کریں۔"
  didnt_hear: "معاف کیجیے {call_her}، آواز نہیں آئی۔ ذرا دوبارہ بتائیں۔"
  still_thinking: "ایک منٹ جی۔"
  stranger: "معاف کیجیے، یہ نمبر نجی ہے۔ خدا حافظ۔"
  and_word: "اور"
  # What helpers hear after pressing a key.
  helper_thanks: "بہت شکریہ۔"
  helper_already_handled: "شکریہ، یہ کام ہو چکا ہے۔"

# Family: the last resort when nobody answers, and always alerted in an emergency.
family:
  - id: son
    name: "Zeeshan"
    spoken_name: "ذیشان"            # how the voice says his name to her, in Urdu script
    phone: "+923001111111"
    language: "en-US"               # family alerts are spoken and texted in English
    language_name: "English"
    speed_dial: "9"                 # she can press 9 instead of speaking

helpers:
  - id: driver
    name: "Rashid"
    spoken_name: "راشد"
    role: "Driver"
    phone: "+923002222222"
    helps_with: "rides, doctor visits, picking up medicines, shopping trips"
    language: "ur-PK"               # how the agent speaks to him (Twilio code)
    language_name: "Urdu"
    available: "8am to 8pm"
    speed_dial: "1"

  - id: maid
    name: "Shazia"
    spoken_name: "شازیہ"
    role: "Housekeeper"
    phone: "+923003333333"
    helps_with: "cleaning, cooking, laundry, help around the house"
    speed_dial: "2"

  - id: nurse
    name: "Nurse Amina"
    spoken_name: "نرس آمنہ"
    role: "Home nurse"
    phone: "+923004444444"
    helps_with: "blood pressure, injections, feeling unwell, medicine questions"
    speed_dial: "3"

  - id: grocer
    name: "Akbar Store"
    spoken_name: "اکبر سٹور"
    role: "Grocery shop"
    phone: "+923005555555"
    helps_with: "groceries, milk, bread, household items delivered"

  - id: plumber
    name: "Bashir"
    spoken_name: "بشیر"
    role: "Plumber and electrician"
    phone: "+923006666666"
    helps_with: "leaks, taps, toilet, water pump, lights, fans, wiring"

settings:
  attempts_per_helper: 3            # calls to each person before moving to the next
  seconds_between_attempts: 120     # wait between calls (a text reply still counts while waiting)
  ring_seconds: 25
  wait_for_answer_seconds: 90       # how long to wait for a key press after calling
  call_mom_with_result: true        # call her back: "Rashid said yes"
  text_mom_with_result: false
  text_family_every_request: false  # true: family gets a text for every request, not just problems
  city: "Lahore"                    # for local weather, news and prayer times
  country: "PK"
  timezone: "Asia/Karachi"
  share_conversations: false        # her words stay private; the family dashboard shows only actions
  emergency_number: "1122"          # said to her in an emergency (1122 Pakistan, 112 EU/India, 911 US)
  allow_unknown_callers: false
  model: "claude-opus-5-5"
  effort: "low"                     # low keeps phone replies quick
  # How the assistant's words are spoken. "twilio" uses a Twilio voice (set mom.voice), "elevenlabs"
  # uses a natural Urdu voice from ElevenLabs (set ELEVENLABS_API_KEY and the voice id). See README.
  speech: "twilio"
  # elevenlabs_voice_id: ""
  # elevenlabs_model: "eleven_v3"
